<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanzador de páginas</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .card {
      background: #1f2937;
      padding: 40px;
      border-radius: 18px;
      max-width: 500px;
      box-shadow: 0 10px 30px #0005;
    }

    h1 {
      margin-bottom: 15px;
      color: #60a5fa;
    }

    p {
      color: #d1d5db;
      font-size: 18px;
      line-height: 1.5;
    }

    .author {
      margin-top: 25px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🚀 Lanzador de páginas</h1>

    <p>
      Esto es un lanzador de páginas web temporales
      hechas por <strong>Dott</strong>.
    </p>

    <div class="author">
      "El autor" — Dott
    </div>
  </div>

</body>
</html>
